services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # The optimistic concurrency strategy (Phase 4) runs transactions at
      # SERIALIZABLE and retries on 40001. Both settings below only affect how
      # much retry pressure we see; neither is required for correctness.
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
